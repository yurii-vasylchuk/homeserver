apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-es
  namespace: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: grafana
    creationPolicy: Owner
  data:
    - secretKey: admin-username
      remoteRef:
        key: kv/data/grafana
        property: admin_username
    - secretKey: admin-password
      remoteRef:
        key: kv/data/grafana
        property: admin_password
