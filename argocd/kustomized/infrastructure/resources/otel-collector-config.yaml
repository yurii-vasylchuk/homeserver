apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: infrastructure
  labels:
    app.kubernetes.io/name: otel-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch: {}
    exporters:
      prometheusremotewrite:
        endpoint: "http://victoria-metrics.infrastructure.svc:8428/api/v1/write"
      otlp/tempo:
        endpoint: tempo.infrastructure.svc:4317
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
