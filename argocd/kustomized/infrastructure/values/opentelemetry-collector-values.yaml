mode: deployment


image:
  repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib"
  tag: 0.130.0
config:
  receivers:
    otlp:
      protocols:
        grpc: { }
        http: { }
  processors:
    batch: { }
  exporters:
    debug:
      verbosity: detailed
    prometheus:
      endpoint: 0.0.0.0:8889
    prometheusremotewrite:
      endpoint: "http://victoria-metrics.infrastructure.svc:8428/api/v1/write"
    otlp/tempo:
      endpoint: tempo.infrastructure.svc:4317
      tls:
        insecure: true
  service:
    pipelines:
      metrics:
        receivers: [ otlp ]
        processors: [ batch ]
        exporters: [ prometheusremotewrite, debug, prometheus ]
      traces:
        receivers: [ otlp ]
        processors: [ batch ]
        exporters: [ otlp/tempo ]
