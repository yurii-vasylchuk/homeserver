---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media-server
spec:
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
        - image: linuxserver/qbittorrent:5.1.2
          imagePullPolicy: IfNotPresent
          name: qbittorrent
          env:
            - name: WEBUI_PORTS
              value: "8080/tcp"
            - name: TORRENTING_PORT
              value: "6881"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: TZ
              value: "Etc/UTC"
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 6881
              protocol: UDP
          volumeMounts:
            - mountPath: /downloads
              name: media
            - mountPath: /config
              name: qbittorrent-config
            - name: webui
              mountPath: /config/data/webui
      restartPolicy: Always
      volumes:
        - name: media
          hostPath:
            type: Directory
            path: /mnt/ssd/media
        - name: qbittorrent-config
          hostPath:
            type: DirectoryOrCreate
            path: /mnt/ssd/qbittorrent-config
        - name: webui
          hostPath:
            path: /home/ubuntu/webui
            type: Directory
