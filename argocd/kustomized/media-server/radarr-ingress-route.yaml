apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-ingressroute
  namespace: media-server
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`radarr.vasylchuk.org.ua`) && PathPrefix(`/`)"
      kind: Rule
      services:
        - name: radarr-svc
          port: 7878
  tls:
    certResolver: letsencrypt

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-http-radarr
  namespace: media-server
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`radarr.vasylchuk.org.ua`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: kube-system
      services:
        - name: noop-svc
          namespace: kube-system
          port: 80
